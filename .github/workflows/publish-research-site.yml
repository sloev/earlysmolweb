name: Update research website

on:
  push:
    branches: [main]
    paths:
      - 'research/**/*.md'
      - 'research/*.md'
      - 'scripts/build_site.py'
      - 'WORK_METHOD.md'
      - 'COUNTRIES.md'
      - '.github/workflows/publish-research-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-site-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site generator
        run: python -m pip install --disable-pip-version-check 'Markdown>=3.6,<4'
      - name: Generate website
        run: python scripts/build_site.py
      - name: Commit refreshed website
        run: |
          if git diff --quiet -- docs/index.html; then
            echo 'Website is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Build public research website [skip ci]'
          git push origin HEAD:main
